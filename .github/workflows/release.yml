# Релиз по тегу v* (docs/releases.md): Clipvey-mac.zip, Clipvey.exe, SHA256SUMS, SHA256SUMS.sig.
#
# Windows собирается на windows-latest: заодно dotnet test проходит на той системе, для которой exe.
# (Собрать exe можно и на ubuntu/macOS — EnableWindowsTargeting, — но тогда тесты шли бы не на Windows.)
# Упаковка, подпись и публикация — на Mac: нужны ditto для zip и swift для scripts/sign-release.swift.
# Mac-часть не передаётся между заданиями как .app: upload-artifact теряет права на исполнение и ссылки.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Тег совпадает с VERSION
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с VERSION ($version)"
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Проверки (dotnet test)
        run: dotnet test windows/Clipvey.Tests/Clipvey.Tests.csproj -c Release

      - name: Сборка Clipvey.exe (dotnet publish)
        run: dotnet publish windows/Clipvey.Windows/Clipvey.Windows.csproj -c Release -o dist/windows

      - uses: actions/upload-artifact@v4
        with:
          name: Clipvey-windows
          path: dist/windows/Clipvey.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Mac, упаковка и публикация
    needs: windows
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Тег совпадает с VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с VERSION ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Проверки протокола (clipvey-checks)
        working-directory: mac
        run: swift run clipvey-checks

      - name: Сборка Clipvey.app
        run: mac/scripts/build.sh

      - uses: actions/download-artifact@v4
        with:
          name: Clipvey-windows
          path: dist/windows

      - name: Упаковка и подпись
        env:
          CLIPVEY_SIGNING_KEY: ${{ secrets.CLIPVEY_SIGNING_KEY }}
        run: |
          if [ -z "$CLIPVEY_SIGNING_KEY" ]; then
            echo "Не задан секрет CLIPVEY_SIGNING_KEY — релиз без подписи не публикуется"
            exit 1
          fi
          scripts/package-release.sh
          # Подпись должна проверяться ключом, зашитым в приложения, иначе обновления её не примут.
          swift scripts/sign-release.swift verify dist/release/SHA256SUMS dist/release/SHA256SUMS.sig

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Clipvey $VERSION" \
            --generate-notes \
            dist/release/Clipvey-mac.zip \
            dist/release/Clipvey.exe \
            dist/release/SHA256SUMS \
            dist/release/SHA256SUMS.sig
